name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: CI Checks
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run unit tests — validate API, processor, and worker logic
        run: |
          python -m pytest tests/unit -v

      - name: Build Lambda deployment packages — create Terraform artifacts
        run: |
          rm -rf terraform/build
          mkdir -p terraform/build

          # Order API package
          mkdir -p terraform/build/order-api-package
          pip install -r app/requirements.txt \
            -t terraform/build/order-api-package

          mkdir -p terraform/build/order-api-package/functions/order_api
          cp app/functions/order_api/handler.py \
            terraform/build/order-api-package/functions/order_api/handler.py

          cd terraform/build/order-api-package
          zip -r ../order-api.zip .
          cd ../../../..

          # Order Processor package
          mkdir -p terraform/build/order-processor-package/functions/order_processor

          cp app/functions/order_processor/handler.py \
            terraform/build/order-processor-package/functions/order_processor/handler.py

          cd terraform/build/order-processor-package
          zip -r ../order-processor.zip .
          cd ../../../..

          # Order Worker package
          mkdir -p terraform/build/order-worker-package/functions/order_worker

          cp app/functions/order_worker/handler.py \
            terraform/build/order-worker-package/functions/order_worker/handler.py

          cd terraform/build/order-worker-package
          zip -r ../order-worker.zip .
          cd ../../../..

      - name: Verify Lambda deployment packages
        run: |
          test -f terraform/build/order-api.zip
          test -f terraform/build/order-processor.zip
          test -f terraform/build/order-worker.zip

          echo "Lambda deployment packages created successfully:"
          ls -lh terraform/build/*.zip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive terraform

      - name: Initialize Terraform — validation only
        run: |
          terraform -chdir=terraform init -backend=false

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=terraform validate
